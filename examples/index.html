<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>react-holdable example</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: #f7f8fa;
        color: #1f2937;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .frame {
        width: min(100%, 720px);
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 5vw, 2.8rem);
        line-height: 1;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: #6b7280;
        max-width: 44ch;
        font-size: 1rem;
        line-height: 1.5;
      }

      .eyebrow {
        display: inline-flex;
        padding: 6px 10px;
        margin-bottom: 14px;
        border-radius: 999px;
        background: #f3f4f6;
        color: #4b5563;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .stage {
        margin-top: 28px;
        display: grid;
        gap: 18px;
      }

      .demo-button {
        border: 1px solid #d1d5db;
        border-radius: 999px;
        padding: 16px 24px;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #111827;
        background: #ffffff;
        cursor: pointer;
        transition:
          transform 120ms ease,
          box-shadow 120ms ease,
          border-color 120ms ease,
          background-color 120ms ease;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      }

      .demo-holdable {
        display: inline-block;
      }

      .button-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .demo-holdable {
        display: inline-block;
      }

      .button-meta {
        margin-top: 8px;
        font-size: 0.85rem;
        color: #6b7280;
        text-align: center;
      }

      .demo-button:hover {
        transform: translateY(-1px);
        border-color: #9ca3af;
        background: #fcfcfd;
      }

      .holdable-active .demo-button {
        transform: scale(0.985);
        background: #f3f4f6;
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.08);
      }

      .status {
        width: min(100%, 480px);
        margin-top: 26px;
        padding: 16px 18px;
        border-radius: 16px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        color: #111827;
        min-height: 70px;
        display: grid;
        align-content: center;
        gap: 4px;
      }

      .status-label {
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6b7280;
      }

      .status-message {
        font-size: 1rem;
        line-height: 1.45;
      }

      code {
        font-family: "IBM Plex Mono", "SFMono-Regular", monospace;
        font-size: 0.95em;
        padding: 0.12em 0.35em;
        border-radius: 6px;
        background: #f3f4f6;
      }

      @media (max-width: 640px) {
        .frame {
          padding: 24px;
          border-radius: 18px;
        }

        .demo-button {
          width: 100%;
        }

        .demo-holdable {
          width: 100%;
        }

        .status {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <div id="app"></div>
    </main>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="../src/Holdable.js"></script>
    <script>
      const root = ReactDOM.createRoot(document.getElementById('app'))
      const Holdable = window.ReactHoldable

      function Example() {
        const [message, setMessage] = React.useState('Try a short click or a hold on any button below.')

        const buttons = [
          { label: 'Fast Hold', timeout: 500 },
          { label: 'Default Hold', timeout: 1000 },
          { label: 'Slow Hold', timeout: 2000 }
        ]

        return React.createElement(
          React.Fragment,
          null,
          React.createElement('div', { className: 'eyebrow' }, 'Interaction Demo'),
          React.createElement('h1', null, 'react-holdable'),
          React.createElement('p', null, 'Local manual demo from ', React.createElement('code', null, 'examples/index.html')),
          React.createElement(
            'div',
            { className: 'stage' },
            React.createElement(
              'div',
              { className: 'button-grid' },
              buttons.map(function(button) {
                return React.createElement(
                  Holdable,
                  {
                    key: button.timeout,
                    timeout: button.timeout,
                    className: 'demo-holdable',
                    onClickComplete: function() {
                      setMessage('Short click detected on ' + button.label + '.')
                    },
                    onHoldComplete: function() {
                      setMessage('Hold detected on ' + button.label + ' after ' + button.timeout + ' ms.')
                    }
                  },
                  React.createElement(
                    'div',
                    null,
                    React.createElement(
                      'button',
                      { className: 'demo-button', type: 'button' },
                      button.label
                    ),
                    React.createElement(
                      'div',
                      { className: 'button-meta' },
                      button.timeout === 1000 ? 'default 1000 ms' : button.timeout + ' ms'
                    )
                  )
                )
              })
            ),
            React.createElement(
              'p',
              null,
              'Click quickly to trigger ',
              React.createElement('code', null, 'onClickComplete'),
              '. Hold past the shown threshold to trigger ',
              React.createElement('code', null, 'onHoldComplete'),
              '.'
            )
          ),
          React.createElement(
            'div',
            { className: 'status' },
            React.createElement('div', { className: 'status-label' }, 'Latest Event'),
            React.createElement('div', { className: 'status-message' }, message)
          )
        )
      }

      root.render(React.createElement(Example))
    </script>
  </body>
</html>
